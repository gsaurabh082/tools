<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dev Tool Manager</title>
  <style>
    :root { color-scheme: dark; --ink: #f4f7ff; --muted: #9cabc4; --line: #27354e; --panel: #111b2d; --panel2: #16223a; --accent: #818cf8; --ok: #48d597; --warn: #fbbf24; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: "Segoe UI", system-ui, sans-serif; background: radial-gradient(circle at 20% -20%, #24376a 0, transparent 34rem), #09111f; color: var(--ink); }
    main { max-width: 1240px; margin: 0 auto; padding: 48px 28px 124px; }
    header { display: flex; gap: 24px; align-items: end; justify-content: space-between; margin-bottom: 36px; }
    .eyebrow { color: #a5b4fc; font-size: .72rem; font-weight: 750; letter-spacing: .14em; margin: 0 0 10px; }
    h1 { font-size: clamp(2rem, 4vw, 3.25rem); letter-spacing: -.05em; line-height: 1; margin: 0; }
    .intro { color: var(--muted); max-width: 550px; line-height: 1.5; margin: 13px 0 0; }
    .tools-total { color: var(--muted); font-size: .9rem; white-space: nowrap; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
    button { border: 0; border-radius: 9px; font: inherit; font-weight: 650; cursor: pointer; transition: transform .14s ease, background .14s ease, opacity .14s ease; }
    button:hover { transform: translateY(-1px); }
    button.secondary { color: #d4ddf0; background: #1b2943; padding: 10px 14px; border: 1px solid #354766; }
    button.secondary:hover { background: #233553; }
    #categories { display: grid; gap: 28px; }
    h2 { color: #dbe5fa; font-size: 1rem; letter-spacing: .02em; margin: 0 0 11px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(218px, 1fr)); gap: 11px; }
    .card { position: relative; display: grid; gap: 10px; min-height: 136px; padding: 17px; background: linear-gradient(145deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; user-select: none; }
    .card:hover { border-color: #60739b; }
    .card.selected { outline: 2px solid var(--accent); border-color: transparent; background: linear-gradient(145deg, #222e56, #151f35); }
    .check { position: absolute; top: 14px; right: 14px; display: grid; place-items: center; width: 22px; height: 22px; border: 1px solid #536582; border-radius: 7px; color: transparent; background: #0d1627; font-size: 14px; }
    .selected .check { border-color: var(--accent); color: white; background: var(--accent); }
    .name { font-weight: 700; font-size: 1rem; padding-right: 30px; }
    .description { color: var(--muted); font-size: .84rem; align-self: end; }
    .status { font-size: .77rem; font-weight: 650; }
    .installed { color: var(--ok); }
    .missing { color: var(--muted); }
    #install-bar { position: fixed; z-index: 2; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 16px; align-items: center; width: min(720px, calc(100vw - 32px)); padding: 12px 12px 12px 18px; border: 1px solid #3b4a68; border-radius: 14px; background: rgba(14, 23, 40, .92); box-shadow: 0 20px 50px #0008; backdrop-filter: blur(16px); }
    #selection { flex: 1; color: var(--muted); font-size: .9rem; }
    #install { padding: 12px 18px; color: white; background: #5b5fda; }
    #install:disabled { cursor: not-allowed; opacity: .45; transform: none; }
    #activity { display: none; position: fixed; z-index: 3; right: 22px; bottom: 94px; width: min(390px, calc(100vw - 44px)); padding: 16px; border: 1px solid #46577a; border-radius: 12px; background: #142039; box-shadow: 0 15px 35px #0008; }
    #activity.show { display: block; }
    #activity strong { display: block; margin-bottom: 6px; }
    #activity p { margin: 5px 0; color: #bfcbdf; font-size: .88rem; }
    .error { color: #fca5a5 !important; }
    @media (max-width: 600px) { main { padding: 32px 16px 118px; } header { display: block; } .tools-total { display: block; margin-top: 18px; } #install-bar { bottom: 12px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">LOCAL ONE-CLICK INSTALLER</p>
        <h1>Dev Tool Manager</h1>
        <p class="intro">Select exactly what you need. Installs run one at a time, and the app stays here to show progress. Required Node, Python, or Docker dependencies are added automatically when missing.</p>
      </div>
      <span class="tools-total" id="tools-total">Loading tools…</span>
    </header>
    <div class="actions">
      <button class="secondary" id="core">Select core stack</button>
      <button class="secondary" id="all">Select all</button>
      <button class="secondary" id="none">Clear selection</button>
    </div>
    <div id="categories"></div>
  </main>
  <section id="activity" aria-live="polite"></section>
  <div id="install-bar">
    <span id="selection">No tools selected</span>
    <button id="install" disabled>Install selected</button>
  </div>
  <script>
    const core = new Set(['java17', 'python312', 'node22', 'maven', 'git']);
    const selected = new Set();
    let tools = [];
    let jobId = null;
    const $ = (s) => document.querySelector(s);

    function updateBar() {
      const count = selected.size;
      $('#selection').textContent = count ? `${count} tool${count === 1 ? '' : 's'} selected` : 'No tools selected';
      $('#install').disabled = !count || !!jobId;
      $('#install').textContent = jobId ? 'Installing…' : `Install selected${count ? ` (${count})` : ''}`;
    }
    function draw() {
      const root = $('#categories'); root.innerHTML = '';
      const categories = [...new Set(tools.map(t => t.category))];
      for (const category of categories) {
        const group = document.createElement('section');
        group.innerHTML = `<h2>${category}</h2><div class="grid"></div>`;
        const grid = group.querySelector('.grid');
        tools.filter(t => t.category === category).forEach(tool => {
          const card = document.createElement('article');
          card.className = `card${selected.has(tool.id) ? ' selected' : ''}`;
          card.innerHTML = `<span class="check">✓</span><span class="name">${tool.name}</span><span class="description">${tool.description}</span><span class="status ${tool.installed ? 'installed' : 'missing'}">${tool.installed ? '● Installed' : '○ Not installed'}</span>`;
          card.onclick = () => { selected.has(tool.id) ? selected.delete(tool.id) : selected.add(tool.id); draw(); updateBar(); };
          grid.append(card);
        });
        root.append(group);
      }
      $('#tools-total').textContent = `${tools.filter(t => t.installed).length} of ${tools.length} tools installed`;
    }
    async function refresh() {
      try { tools = await (await fetch('/api/tools')).json(); draw(); updateBar(); }
      catch { show('Cannot reach the local installer. Run the .bat file again.', true); }
    }
    function show(text, isError = false, lines = []) {
      const box = $('#activity');
      box.innerHTML = `<strong${isError ? ' class="error"' : ''}>${text}</strong>${lines.map(x => `<p class="${x.success === false ? 'error' : ''}">${x.name}: ${x.message}</p>`).join('')}`;
      box.classList.add('show');
    }
    async function checkJob() {
      try {
        const job = await (await fetch(`/api/jobs/${jobId}`)).json();
        const text = job.status === 'complete' ? 'Installation complete' : job.current ? `Installing ${job.current}…` : 'Preparing installation…';
        show(text, false, job.results);
        if (job.status === 'complete') { jobId = null; selected.clear(); refresh(); updateBar(); return; }
        setTimeout(checkJob, 800);
      } catch { jobId = null; show('Installation status could not be read.', true); updateBar(); }
    }
    $('#core').onclick = () => { tools.filter(t => core.has(t.id)).forEach(t => selected.add(t.id)); draw(); updateBar(); };
    $('#all').onclick = () => { tools.forEach(t => selected.add(t.id)); draw(); updateBar(); };
    $('#none').onclick = () => { selected.clear(); draw(); updateBar(); };
    $('#install').onclick = async () => {
      try {
        const response = await fetch('/api/install', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({tools: [...selected]}) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Installation could not start.');
        jobId = data.id; updateBar(); checkJob();
      } catch (error) { show(error.message, true); }
    };
    refresh();
    setInterval(() => { if (!jobId) refresh(); }, 7000);
  </script>
</body>
</html>
