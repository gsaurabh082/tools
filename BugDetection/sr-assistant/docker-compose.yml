services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./backend/data:/app/data
      - ./prompts:/app/prompts:ro
      # Mount the DoseWatch codebase read-only so the workspace scanner can access it
      - ${DOSEWATCH_WORKSPACE:-C:/Users/250020392/project}:/dosewatch-workspace:ro
    environment:
      - PORT=3001
      - FRONTEND_ORIGIN=http://localhost:5173
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-4-5}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - JIRA_BASE_URL=${JIRA_BASE_URL:-}
      - JIRA_USERNAME=${JIRA_USERNAME:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      - DOSEWATCH_WORKSPACE=/dosewatch-workspace
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
